# 依存の更新をPull Requestにする（docs/development.md §4）。公開直後の版は避けるため、cooldownを置く
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
  - package-ecosystem: uv
    directory: /api
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      python: { patterns: ['*'], update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      npm: { patterns: ['*'], update-types: [minor, patch] }
