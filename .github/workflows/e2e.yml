# E2E（docs/development.md §3.2・§4）。deploy/compose.yaml に compose.e2e.yaml を重ねて起動し、確認用のデータ（seed_dev）と
# 偽のLLM（fake_llm）でPlaywrightを流す。Pull Requestでは、ラベル e2e を付けたときだけ動かす
name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['api/**', 'frontend/**', 'sandbox/**', 'deploy/**', 'mise.toml', '.github/workflows/e2e.yml', '.github/actions/install-gvisor/**']
  push:
    branches: [main]
    paths: ['api/**', 'frontend/**', 'sandbox/**', 'deploy/**', 'mise.toml', '.github/workflows/e2e.yml', '.github/actions/install-gvisor/**']
  schedule:
    - cron: '30 18 * * 0' # 毎週月曜 3:30（日本時間）。mainへのマージは [skip ci] が多いので、定期的にも確かめる
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'e2e')
      && (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 関係のないラベルを付けたときに（上のifで飛ばす）、動いているものを止めないよう、workflowではなくjobに置く
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      YORIKI_API_IMAGE: yoriki-api:ci
      YORIKI_FRONTEND_IMAGE: yoriki-frontend:ci
      YORIKI_ENV_FILE: ${{ github.workspace }}/ci/yoriki.env
      YORIKI_DB_ENV_FILE: ${{ github.workspace }}/ci/postgres.env
      YORIKI_NGINX_CERTS_DIR: ${{ github.workspace }}/ci/certs
      COMPOSE: docker compose -f deploy/compose.yaml -f deploy/compose.e2e.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      # Dockerを再起動するので、イメージのビルドとコンテナの起動より先に入れる
      - uses: ./.github/actions/install-gvisor

      - name: 設定ファイルと自己署名の証明書を用意する
        run: |
          mkdir -p ci/certs
          key=$(openssl rand -base64 32 | tr '+/' '-_')
          cat > ci/yoriki.env <<ENV
          DJANGO_SETTINGS_MODULE=app.settings
          YORIKI_SECRET_KEY=ci-only-not-secret
          YORIKI_DEBUG=true
          YORIKI_ALLOWED_HOSTS=localhost
          YORIKI_DATABASE_NAME=yoriki
          YORIKI_DATABASE_USER=yoriki
          YORIKI_DATABASE_PASSWORD=yoriki
          YORIKI_DATABASE_HOST=postgres
          YORIKI_SECRET_ENCRYPTION_KEYS=$key
          YORIKI_STORAGE_ACCEL_REDIRECT=/_protected/
          YORIKI_SANDBOX_INSECURE_REGISTRIES=registry:5000
          YORIKI_SANDBOX_IMAGE_OVERRIDE=yoriki-sandbox-docs:ci
          ENV
          printf 'POSTGRES_DB=yoriki\nPOSTGRES_USER=yoriki\nPOSTGRES_PASSWORD=yoriki\n' > ci/postgres.env
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -keyout ci/certs/privkey.pem -out ci/certs/fullchain.pem
          sudo install -d -o 10001 -g 10001 /var/lib/yoriki/workspaces /var/lib/yoriki/objects
          echo "YORIKI_DOCKER_GID=$(getent group docker | cut -d: -f3)" >> "$GITHUB_ENV"

      - name: イメージをビルドする
        run: |
          $COMPOSE build
          docker build -f sandbox/images/docs/Dockerfile -t yoriki-sandbox-docs:ci sandbox

      # Runtime Profileの登録はレジストリを読むので、pushしておく（Sandboxはビルドしたイメージで起動する）
      - name: Sandboxのイメージをpushする
        run: |
          $COMPOSE up -d registry
          curl -fsS --retry 20 --retry-delay 1 --retry-all-errors http://localhost:5001/v2/
          docker tag yoriki-sandbox-docs:ci localhost:5001/yoriki-sandbox-docs:ci
          docker push localhost:5001/yoriki-sandbox-docs:ci
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' localhost:5001/yoriki-sandbox-docs:ci | cut -d@ -f2)
          echo "YORIKI_E2E_SANDBOX_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: migrationと確認用のデータを入れて起動する
        run: |
          $COMPOSE run --rm migrate
          $COMPOSE run --rm seed
          $COMPOSE up -d
          curl -fsSk --retry 40 --retry-delay 3 --retry-all-errors https://localhost/api/ping/

      - name: Playwrightを流す
        working-directory: frontend
        env:
          YORIKI_E2E_BASE_URL: https://localhost
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps --only-shell chromium
          pnpm test:e2e

      - name: 失敗したときのログ
        if: failure()
        run: |
          $COMPOSE ps -a
          $COMPOSE logs --no-color --tail 300

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: 後片付け
        if: always()
        run: $COMPOSE down -v
