# ランディングページ（site/）をGitHub Pagesへ配備する
# - リポジトリの Settings → Pages → Source を「GitHub Actions」にしておく。
# - main への push では、リポジトリの変数 SITE_DEPLOY が true のときだけ配備する（それ以外は skipped になる）。
#   手動実行（workflow_dispatch）は変数に関係なく配備する。site/ だけの変更に [skip ci] は要らない
#   （他の workflow は paths で動かない）。
# TODO: 他のworkflowと同じく、actionsをcommit SHAで固定する。
name: site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.SITE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # 公開するファイルだけを集める（site/README.md は開発者向けなので配備しない）
      - run: |
          cp -r site _site
          rm _site/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
