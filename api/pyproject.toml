[project]
name = "yoriki-api"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "anthropic>=1.12.1",
    "boto3>=1.43.110",
    "cryptography>=50.0.2",
    "django>=6.1.2",
    "django-allauth[socialaccount]>=65.20.0",
    "django-auditlog>=3.4.1",
    "django-axes>=8.3.1",
    "django-extensions>=4.1",
    "django-filter>=26.2",
    "django-q2>=1.11.1",
    "djangorestframework>=3.18.3",
    "docker>=7.1.0",
    "drf-spectacular>=0.30.0",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "nanoid>=2.0.0",
    "openai>=3.26.1",
    "psycopg[binary,pool]>=3.3.6",
    "python-pptx>=1.0.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "factory-boy>=3.3.3",
    "moto[s3]>=5.2.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
    "types-boto3[s3]>=1.43.111",
    "types-docker>=7.2.0.20261006",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.uv]
package = false

[tool.mypy]
mypy_path = "src"
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["allauth.*", "auditlog.*", "axes.*", "django_filters.*", "django_q.*", "nanoid.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "app.settings"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src"]
python_files = ["tests.py", "test_*.py", "*_test.py"]
# .envrc の DJANGO_SETTINGS_MODULE より優先させるため、iniではなくコマンドラインの引数で指定する
addopts = "--ds=app.settings_test --reuse-db"
markers = [
    "sandbox: 実際のDockerとSandboxのイメージを使う（イメージがなければ飛ばす。CIでは backend.yml の sandbox-runner で動かす）",
]
