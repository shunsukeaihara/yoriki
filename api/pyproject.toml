[project]
name = "yoriki-api"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "anthropic>=2.7.0",
    "boto3>=1.43.127",
    "cryptography>=50.0.2",
    "django>=6.1.3",
    "django-allauth[socialaccount]>=65.21.1",
    "django-auditlog>=3.4.2",
    "django-axes>=9.0.0",
    "django-extensions>=4.1",
    "django-filter>=26.2",
    "django-q2>=1.11.1",
    "djangorestframework>=3.18.3",
    "docker>=7.1.0",
    "drf-spectacular>=0.30.0",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "nanoid>=2.0.0",
    "openai>=3.49.0",
    "packaging>=26.3",
    "psycopg[binary,pool]>=3.3.8",
    "pymysql>=1.2.4",
    "pyodbc>=5.5.0",
    "python-pptx>=1.0.2",
    "sqlglot>=30.30.0",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "beartype>=0.23.1",
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
    "factory-boy>=3.3.3",
    "moto[s3]>=5.2.5",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
    "types-boto3[s3]>=1.43.123",
    "types-docker>=7.2.0.20261102",
    "types-jsonschema>=4.26.0.20261006",
    "types-pymysql>=1.2.0.20260923",
]

[tool.uv]
package = false

[tool.mypy]
mypy_path = "src"
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["allauth.*", "auditlog.*", "axes.*", "django_filters.*", "django_q.*", "nanoid.*", "pyodbc"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "app.settings"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src"]
python_files = ["tests.py", "test_*.py", "*_test.py"]
# .envrc の DJANGO_SETTINGS_MODULE より優先させるため、iniではなくコマンドラインの引数で指定する。
# pytest-xdistで並列に動かす（プロセスごとにテスト用のDBを作る。docs/development.md §3.1）。プロセスごとに
# 接続プール（最大10）を持つので、PostgreSQLの接続の上限（既定100）を超えないようにプロセスの数を8までにする
addopts = "--ds=app.settings_test --reuse-db -n auto --maxprocesses 8 --dist worksteal"
markers = [
    "sandbox: 実際のDockerとSandboxのイメージを使う（イメージがなければ飛ばす。CIでは backend.yml の sandbox-runner で動かす）",
]
