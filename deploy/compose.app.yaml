# アプリサーバー（docs/deployment.md §3.1、§8.4）。nginx・frontend・api・qcluster（defaultクラスタ）。
# 複数台構成ではこのファイルだけで立てる（DBは別のサーバー、ファイルはS3）。単一ホストでは compose.yaml を使う。
#   docker compose -f deploy/compose.app.yaml up -d
# 前段（エッジのnginx、Cloudflare Tunnel、認証プロキシ）がTLSを終端し、このnginxは私設ネットワークの80番で受ける。
name: yoriki

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '5' }

x-api: &api
  image: ${YORIKI_API_IMAGE:?deploy/.env に YORIKI_API_IMAGE を設定してください}
  build: { context: ../api }
  env_file: [{ path: '${YORIKI_ENV_FILE:-/etc/yoriki/yoriki.env}' }]
  restart: unless-stopped
  logging: *logging

services:
  nginx:
    image: nginx:1.30@sha256:eb1c896deef834f4e056829fd6dadac8305501f16cc71ba65fb252c8d0aa168e
    ports:
      # 私設ネットワークのアドレスだけで待ち受ける（インターネットには公開しない）
      - '${YORIKI_PRIVATE_BIND:-127.0.0.1}:${YORIKI_HTTP_PORT:-80}:80'
    volumes:
      - ./nginx/sites/http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - static:/var/lib/yoriki/static:ro
    networks: [edge]
    depends_on:
      static: { condition: service_completed_successfully }
      api: { condition: service_healthy }
      frontend: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  frontend:
    image: ${YORIKI_FRONTEND_IMAGE:?deploy/.env に YORIKI_FRONTEND_IMAGE を設定してください}
    build: { context: ../frontend }
    networks: [edge]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *logging

  api:
    <<: *api
    # apiの8000番はDockerのネットワークの中だけに開き、nginxからしか届かない。nginxは X-Forwarded-For を
    # 利用者のIPアドレス1つで上書きして渡すので（deploy/nginx/snippets/proxy.conf）、ここでは送信元を絞らない
    command: >-
      uvicorn app.asgi:application --host 0.0.0.0 --port 8000 --workers ${YORIKI_API_WORKERS:-4}
      --proxy-headers --forwarded-allow-ips=* --timeout-graceful-shutdown 30
    networks: [edge, backend, egress]
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ping/')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # 配信・Outbox・清掃（defaultクラスタ）。Agentの実行は、単一ホストでは compose.yaml の qcluster、
  # 複数台構成ではWorkerサーバー（compose.qcluster.yaml）が受け持つ
  qcluster:
    <<: *api
    command: python manage.py qcluster
    networks: [backend, egress]
    stop_grace_period: 2m

  # apiのイメージに入れた静的ファイルを、nginxが読む共有ボリュームへコピーして終わる。
  # イメージを更新すると `up -d` のたびに作り直されてコピーし直す。古い版のファイルは消さない（開いたままの画面が使う）
  static:
    <<: *api
    command: ['cp', '-a', '/app/static/.', '/var/lib/yoriki/static/']
    user: root
    volumes:
      - static:/var/lib/yoriki/static
    network_mode: none
    restart: 'no'

  # migrationは自動で実行しない。更新手順で明示的に実行する（docs/deployment.md §6）
  #   docker compose -f deploy/compose.app.yaml run --rm migrate
  migrate:
    <<: *api
    command: python manage.py migrate --noinput
    networks: [backend, egress]
    profiles: [tools]
    restart: 'no'

volumes:
  static: {}

networks:
  edge: {}
  backend:
    internal: true # 外へ出られない。外部（DB、LLM、S3等）へ通信するサービスは egress にも参加させる
  egress: {}
