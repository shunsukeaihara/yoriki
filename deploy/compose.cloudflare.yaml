# Cloudflare Tunnelで公開する（docs/deployment.md §8.3）。compose.yaml に重ねて使う。
#   docker compose -f deploy/compose.yaml -f deploy/compose.cloudflare.yaml up -d
# Cloudflare側のトンネルの設定で、公開するホスト名を http://nginx:80 へ転送する。
services:
  nginx:
    ports: !reset [] # ホストのポートを公開しない。nginxは内部の80番だけで待ち受ける
    volumes: !override
      - ./nginx/sites/http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - static:/var/lib/yoriki/static:ro

  cloudflared:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    command: tunnel --no-autoupdate run
    env_file: [{ path: '${YORIKI_CLOUDFLARED_ENV_FILE:-/etc/yoriki/cloudflared.env}' }] # TUNNEL_TOKEN
    networks: [edge]
    depends_on: [nginx]
    deploy:
      replicas: 2 # 片方が止まっても公開を続けられるようにする
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '5' }
