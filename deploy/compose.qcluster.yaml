# qclusterだけを動かすWorkerサーバー（docs/deployment.md §3.2）。外からの接続は受けない。
#   docker compose -f deploy/compose.qcluster.yaml up -d
# アプリサーバーと同じ yoriki.env を使い、同じ私設ネットワークに置く（DB・S3へ直接接続する）。
# クラスタは1つなので、アプリサーバーのqclusterと同じ仕事（エージェントの実行、配信・Outbox・清掃）を受け持つ。
name: yoriki-worker

services:
  qcluster:
    extends: { file: compose.app.yaml, service: qcluster }
    networks: !override [egress]

networks:
  egress: {}
