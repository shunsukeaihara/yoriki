# 複数台構成のエッジ（docs/deployment.md §8.4のC）。cloudflaredから受け、アプリサーバーのnginxへ振り分ける。
# 振り分け先は /etc/nginx/yoriki/app-servers.conf（deploy/nginx/edge/app-servers.conf.example を元に作る）
upstream yoriki_app {
    include /etc/nginx/yoriki/app-servers.conf;
    keepalive 32;
}

# cloudflaredは同じDockerネットワークにある
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 100m;  # Cloudflareの無料プランの上限。実際の上限はアプリサーバーのnginxで決める

    location / {
        proxy_pass http://yoriki_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # SSEはバッファせず、長く待つ
    location ~ ^/api/app/v1/(runs/[^/]+/)?stream/$ {
        proxy_pass http://yoriki_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location = /edge-health {
        access_log off;
        return 200 "ok\n";
    }
}
