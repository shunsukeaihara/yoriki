# 前段がTLSを終端する構成（Cloudflare Tunnel、認証プロキシの裏、複数台構成のアプリサーバー。
# docs/deployment.md §8.3〜§8.6）。nginxは80番だけで待ち受け、前段からの接続だけを受ける。
include snippets/upstreams.conf;

# 利用者のIPアドレスは、前段（cloudflared・エッジのnginx・前段のnginx）が付けた X-Forwarded-For から取る。
# 前段は同じホストのDockerネットワークか、私設ネットワークにある前提で、私設のアドレスだけを信頼する。
# このnginxをインターネットへ直接公開しない（公開すると X-Forwarded-For を偽装できる）
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# 前段がHTTPSで受けたかどうかは、前段の X-Forwarded-Proto に従う（cloudflaredは https を付ける）
map $http_x_forwarded_proto $yoriki_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}
map $yoriki_forwarded_proto $yoriki_hsts {
    https "max-age=31536000";
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    include snippets/yoriki-locations.conf;
}
