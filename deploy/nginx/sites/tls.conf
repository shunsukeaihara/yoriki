# nginxで直接公開する構成（docs/deployment.md §3.1、§8）。TLSをnginxで終端する。
# 証明書は YORIKI_NGINX_CERTS_DIR（既定 /etc/yoriki/certs）の fullchain.pem・privkey.pem
include snippets/upstreams.conf;

map $host $yoriki_forwarded_proto { default https; }
map $host $yoriki_hsts { default "max-age=31536000"; }

server {
    listen 80;
    listen [::]:80;
    server_name _;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    include snippets/yoriki-locations.conf;
}
