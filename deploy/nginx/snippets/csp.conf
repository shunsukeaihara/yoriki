# フロントエンド（/）向けのCSP。画面とAPIは同じオリジンなので、外部への接続は許可しない。
# NuxtのSPAはHTMLにインラインのスクリプト（色モードの初期化、window.__NUXT__ の設定）を含み、
# Nuxt UIのスタイルもインラインで入るため、script-src・style-src に 'unsafe-inline' を許可している。
# インラインのスクリプトのハッシュかnonceで絞るのは今後の課題（docs/deployment.md §4.1）
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self' https:" always;
