# apiとfrontendへの転送に共通の設定。パスは書き換えずに転送する（docs/deployment.md §4.1）
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# 利用者のIPアドレスは、このnginxが判定した $remote_addr だけで上書きして渡す。受け取った X-Forwarded-For に
# 付け足すと、利用者が書いた値が先頭に残り、Uvicorn（--forwarded-allow-ips=*）がそれを REMOTE_ADDR にしてしまう
# （ログインの試行回数の制限を逃れられる）。前段がある構成では、$remote_addr は set_real_ip_from で解決済み
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $yoriki_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
