# 単一ホスト・アプリサーバーの転送先（同じComposeのサービス）
upstream api {
    server api:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=yoriki_hooks:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=yoriki_files:10m rate=5r/s;
limit_req_status 429;

# 出口へ渡した成果物の取得（/api/files/<token>/）のアクセスログ。tokenだけで期限の間ファイルを取得できるので、
# パスを残さない（design.md §4.4）
log_format yoriki_files '$remote_addr - $remote_user [$time_local] "$request_method /api/files/*** $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent"';
