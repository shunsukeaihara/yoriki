# 単一ホスト・アプリサーバーの転送先（同じComposeのサービス）
upstream api {
    server api:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
    keepalive 16;
}

# 転送する Host。利用者が送った Host をポートごと渡す。$host はポートを落とすので、80・443以外のポートで公開すると、
# Djangoが組み立てるURL（SSOの redirect_uri、招待のURL）と、CSRFの Origin の照合からポートが落ちる。
# Host のない要求（HTTP/1.0）は $host（server_name）にする
map $http_host $yoriki_host {
    "" $host;
    default $http_host;
}

# frontendがCSPを付けなかった応答に付けるもの（snippets/csp.conf）
map $upstream_http_content_security_policy $yoriki_default_csp {
    "" "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'";
    default "";
}

limit_req_zone $binary_remote_addr zone=yoriki_hooks:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=yoriki_files:10m rate=5r/s;
limit_req_status 429;

# 出口へ渡した成果物の取得（/api/files/<token>/）のアクセスログ。tokenだけで期限の間ファイルを取得できるので、
# パスを残さない（design.md §4.4）
log_format yoriki_files '$remote_addr - $remote_user [$time_local] "$request_method /api/files/*** $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent"';
