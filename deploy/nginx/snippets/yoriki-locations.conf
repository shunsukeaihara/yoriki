# Yorikiのパスの振り分け（docs/deployment.md §4.1）。sites/*.conf の server から include する。
# add_header は location に書くと server の add_header が引き継がれないので、各locationで必要なものを include する

# 通常のAPIのリクエストの本文の上限。添付のアップロードだけ大きくする（下）
client_max_body_size 10m;

location / {
    proxy_pass http://frontend;
    include snippets/proxy.conf;
    include snippets/security-headers.conf;
    include snippets/csp.conf;
}

location /api/ {
    proxy_pass http://api;
    include snippets/proxy.conf;
    include snippets/security-headers.conf;
}

# Djangoの静的ファイル（管理画面等）。apiのイメージのビルド時に集めたものを、static サービスが共有ボリュームへ
# コピーする（deploy/compose.app.yaml）。ファイル名に内容のハッシュが付くので長くキャッシュさせる
location /api/static/ {
    alias /var/lib/yoriki/static/;
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# SSE。/api/app/v1/stream/ と /api/app/v1/runs/{id}/stream/ の両方に合わせる
location ~ ^/api/app/v1/(runs/[^/]+/)?stream/$ {
    proxy_pass http://api;
    include snippets/proxy.conf;
    include snippets/sse.conf;
    include snippets/security-headers.conf;
}

# 会話への添付と、タスクの手動実行（型がファイルの項目）のアップロード。前段の上限（Cloudflareは100MB。
# docs/deployment.md §8.5）に合わせる。
# 1つのファイルの上限は、apiの YORIKI_UPLOAD_MAX_MB で決める
location ~ ^/api/app/v1/(conversations/[^/]+/artifacts|tasks/[^/]+/run)/$ {
    client_max_body_size 100m;
    proxy_pass http://api;
    include snippets/proxy.conf;
    include snippets/security-headers.conf;
}

# Webhook・Channelの受信。rate limitを強くする。本文の上限は入口ごとの設定の最大（10MiB）に合わせ、
# 入口ごとの上限（既定1MiB）はapiで確かめる
location /api/hooks/ {
    client_max_body_size 10m;
    limit_req zone=yoriki_hooks burst=20 nodelay;
    proxy_pass http://api;
    include snippets/proxy.conf;
    include snippets/security-headers.conf;
}

# 成果物の期限付き取得（セッションを使わずtokenを確認する）
location /api/files/ {
    limit_req zone=yoriki_files burst=10 nodelay;
    proxy_pass http://api;
    include snippets/proxy.conf;
    include snippets/security-headers.conf;
}

# apiが権限とtokenを確認した後、X-Accel-Redirectでだけ使う。外から直接は取得できない（Local保存のとき）。
# Content-Type・Content-Disposition・Cache-Controlはapiの応答のものが使われる。エージェントが作ったHTML等を
# 同じoriginで動かさないよう、ここでもCSPのsandboxを付ける
location /_protected/ {
    internal;
    alias /var/lib/yoriki/objects/;
    include snippets/security-headers.conf;
    add_header Content-Security-Policy "sandbox; default-src 'none'" always;
}

# ヘルスチェック。ログに残さない
location = /api/ping/ {
    access_log off;
    proxy_pass http://api;
    include snippets/proxy.conf;
}
