    PatchedConnectorUpdateRequest:
      type: object
      description: Connectorの更新。使うDB接続と範囲・部門は変えられないので、読み取り専用にする
      properties:
        name:
          type: string
          minLength: 1
          title: 名前
          maxLength: 100
        is_active:
          type: boolean
          title: 有効
        version:
          type: integer
          minimum: 0
          description: 現在の版。更新では、編集を始めた時点の値を送る（作成では送らない）
        description:
          type: string
          default: ''
          description: エージェントに見せる、このConnectorの説明
          maxLength: 5000
        default_schema:
          type: string
          description: 表の名前にスキーマを書かなかったときのスキーマ。省略すると種別の既定（public、dbo）
          maxLength: 128
        tables:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorTableEntryRequest'
        max_rows:
          type: integer
          maximum: 1000000
          minimum: 1
          default: 1000
        max_result_bytes:
          type: integer
          maximum: 1073741824
          minimum: 1024
          default: 10485760
        timeout_seconds:
          type: integer
          maximum: 3600
          minimum: 1
          default: 30
        is_sensitive:
          type: boolean
          default: false
          description: 個人情報を主な中身とする範囲。ローカルLLMのモデルを使うタスク・会話にだけ割り当てる
        change_reason:
          type: string
          writeOnly: true
          maxLength: 500
    PatchedConversationRequest:
      type: object
      description: 自分の会話。モデル設定を省くと既定のモデル設定にする。実行中に変えると、次のステップから切り替わる
      properties:
        model_profile:
          type: string
          minLength: 1
        effort:
          type: string
          description: 空ならモデルの既定。値を入れると固定する
          maxLength: 50
        handles_sensitive_data:
          type: boolean
          title: 個人情報・機密情報を扱う
        title:
          type: string
          title: タイトル
          maxLength: 200
    PatchedDatabaseConnectionUpdateRequest:
      type: object
      description: DB接続の更新。種別は変えられない（SQLの方言と既定のスキーマの意味が変わるため）
      properties:
        name:
          type: string
          minLength: 1
          title: 名前
          maxLength: 100
        host:
          type: string
          minLength: 1
          title: ホスト
          maxLength: 255
        port:
          type: integer
          maximum: 65535
          minimum: 1
          description: 省略すると種別の既定のポート
        database:
          type: string
          minLength: 1
          title: DB名
          maxLength: 128
        username:
          type: string
          minLength: 1
          title: ユーザー名
          maxLength: 128
        password:
          type: string
          writeOnly: true
          description: 更新では、送らなければ変更しない（ホスト・ポート・DB名を変えるときは必須）
          maxLength: 1000
        tls:
          allOf:
          - $ref: '#/components/schemas/TlsEnum'
          title: 通信の暗号化
          minimum: 0
          maximum: 32767
        connect_timeout_seconds:
          type: integer
          maximum: 300
          minimum: 1
          title: 接続のタイムアウト（秒）
        max_concurrency:
          type: integer
          maximum: 1000
          minimum: 1
          title: 同時実行数の上限
        is_active:
          type: boolean
          title: 有効
    PatchedDepartmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: 名前
          maxLength: 100
    PatchedDestinationUpdateRequest:
      type: object
      description: 出口の更新。種類・範囲・部門は変えられない
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        version:
          type: integer
          minimum: 0
          description: 今の版。更新では、編集を始めた時点の値を送る（作成では送らない）
        url:
          type: string
          writeOnly: true
          description: 送り先のURL（https）。Webhook・Zapierでは必須、画面の通知では送らない。表示では返さない
          maxLength: 2000
        allows_sensitive_results:
          type: boolean
          description: 機密（個人情報・機密情報を扱う）のタスクの結果を送ってよい。画面の通知は認証の要る画面への参照だけなので、この指定によらず機密のタスクにも使える
        change_reason:
          type: string
          writeOnly: true
          maxLength: 500
    PatchedLLMConnectionUpdateRequest:
      type: object
      description: プロバイダ接続の更新。種別とbase URL（接続先）は変えられないので、読み取り専用にする
      properties:
        name:
          type: string
          minLength: 1
          title: 名前
          maxLength: 100
        api_key:
          type: string
          writeOnly: true
          description: 更新では、送らなければ変更しない。空文字はAPI keyなし（ローカルLLMだけ）
          maxLength: 1000
        timeout_seconds:
          type: integer
          maximum: 3600
          minimum: 1
          title: タイムアウト（秒）
        max_concurrency:
          type: integer
          maximum: 1000
          minimum: 1
          title: 同時実行数の上限
        requests_per_minute:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
          title: 1分あたりの要求数の上限
        is_active:
          type: boolean
          title: 有効
    PatchedManageUserUpdateRequest:
      type: object
      description: ユーザーの更新。メールアドレスはSSOの紐付けに使うので変えない
      properties:
        display_name:
          type: string
          title: 表示名
          maxLength: 150
        groups:
          type: array
          items:
            type: string
            minLength: 1
            title: 名前
          description: Groupの名前
        is_active:
          type: boolean
          title: 有効
          description: ユーザーがアクティブかどうかを示します。アカウントを削除する代わりに選択を解除してください。
    PatchedModelProfileRequest:
      type: object
      description: |-
        モデル設定。中身（接続、モデル名、上限、単価、能力）は現在の版の値を平らに出す。

        中身を変えて保存すると、サーバーが新しい版を作る。更新では、編集を始めた時点の `version` を送り、
        その間に他の人が版を作っていたら409になる
      properties:
        name:
          type: string
          minLength: 1
          title: 名前
          maxLength: 100
        is_active:
          type: boolean
          title: 有効
        version:
          type: integer
          minimum: 0
          description: 現在の版。更新では、編集を始めた時点の値を送る（作成では送らない）
        connection:
          type: string
          minLength: 1
        model_name:
          type: string
          minLength: 1
          maxLength: 200
        max_input_tokens:
          type: integer
          minimum: 1
        max_output_tokens:
          type: integer
          minimum: 1
        input_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          default: '0.000000'
        cached_input_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          default: '0.000000'
        output_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          default: '0.000000'
        supports_tools:
          type: boolean
          default: false
        supports_images:
          type: boolean
          default: false
        supports_documents:
          type: boolean
          default: false
        supports_audio:
          type: boolean
          default: false
        supports_video:
          type: boolean
          default: false
        supports_structured_output:
          type: boolean
          default: false
        supports_prompt_caching:
          type: boolean
          default: false
        supports_reasoning:
          type: boolean
          default: false
        effort_values:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          description: モデルが受け付けるeffortの値（各社の指定そのまま）。推論の制御に対応するモデルだけ
          maxItems: 20
        default_effort:
          type: string
          default: ''
          maxLength: 50
        change_reason:
          type: string
          writeOnly: true
          maxLength: 500
    PatchedRuntimeProfileRequest:
      type: object
      description: |-
        Runtime Profile。中身（イメージ、資源の上限）は現在の版の値を平らに出す。

        イメージは「名前@sha256:digest」で受け取り、レジストリのAPIで契約番号と対応platformを確かめてから版に入れる
        （design.md §7.3）。中身を変えて保存すると新しい版を作る。更新では、編集を始めた時点の `version` を送る
      properties:
        name:
          type: string
          minLength: 1
          title: 名前
          maxLength: 100
        is_active:
          type: boolean
          title: 有効
        version:
          type: integer
          minimum: 0
          description: 現在の版。更新では、編集を始めた時点の値を送る（作成では送らない）
        image:
          type: string
          minLength: 1
          description: 「名前@sha256:digest」（例：yoriki/yoriki-sandbox-docs@sha256:…）。タグだけの指定はできない
          maxLength: 500
        memory_mb:
          type: integer
          maximum: 65536
          minimum: 512
        cpus:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        pids_limit:
          type: integer
          maximum: 4096
          minimum: 64
        tmp_mb:
          type: integer
          maximum: 8192
          minimum: 16
        work_mb:
          type: integer
          maximum: 32768
          minimum: 64
        output_mb:
          type: integer
          maximum: 32768
          minimum: 16
        env_mb:
          type: integer
          maximum: 32768
          minimum: 16
        command_timeout_seconds:
          type: integer
          maximum: 3600
          minimum: 10
        job_timeout_seconds:
          type: integer
          maximum: 86400
          minimum: 60
        change_reason:
          type: string
          writeOnly: true
          maxLength: 500
    PatchedSSOProviderUpdateRequest:
      type: object
      description: SSOの設定の更新。種別は変えられないので、読み取り専用にする
      properties:
        client_id:
          type: string
          minLength: 1
          maxLength: 500
        client_secret:
          type: string
          writeOnly: true
          minLength: 1
          description: 作成では必須。更新では、送らなければ変更しない
          maxLength: 1000
        tenant_id:
          type: string
          title: テナントID
          maxLength: 200
        hosted_domain:
          type: string
          title: Workspaceのドメイン
          maxLength: 253
        allowed_email_domains:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 253
          description: 受け付けるメールアドレスのドメイン（例：example.co.jp）
        is_active:
          type: boolean
          title: 有効
    PatchedSkillDraftAssetUpdateRequest:
      type: object
