          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedModelProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedModelProfileRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProfile'
          description: ''
        '409':
