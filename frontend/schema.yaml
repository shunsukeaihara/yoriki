    RunEndReasonEnum:
      enum:
      - 1
      - 2
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 17
      - 99
      type: integer
      description: |-
        * `1` - 完了
        * `2` - 停止
        * `10` - ステップ数の上限
        * `11` - 予算の上限
        * `12` - 文脈に収まらない
        * `13` - モデルにつながらない
        * `14` - 同じ誤りの繰返し
        * `15` - 業務結果がない
        * `16` - 再試行の上限
        * `17` - 回答期限切れ
        * `99` - 内部のエラー
    RunEventKindEnum:
      enum:
      - 1
      - 10
      - 11
      - 12
      - 21
      - 30
      - 31
      - 32
      - 40
      - 50
      - 51
      - 60
      - 90
      type: integer
      description: |-
        * `1` - 状態の遷移
        * `10` - 利用者の発言
        * `11` - エージェントの応答
        * `12` - 失敗した応答
        * `21` - Toolの結果
        * `30` - 要求の中身
        * `31` - 実行時の文脈
        * `32` - 文脈の圧縮
        * `40` - モデルの切り替え
        * `50` - 確認の質問
        * `51` - 確認への回答
        * `60` - モデルの再試行
        * `90` - 実行の終了
