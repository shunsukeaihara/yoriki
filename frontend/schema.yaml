          type: string
          minLength: 1
          maxLength: 500
        client_secret:
          type: string
          writeOnly: true
          minLength: 1
          description: 作成では必須。更新では、送らなければ変更しない
          maxLength: 1000
        tenant_id:
          type: string
          title: テナントID
          maxLength: 200
        hosted_domain:
          type: string
          title: Workspaceのドメイン
          maxLength: 253
        allowed_email_domains:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 253
          description: 受け付けるメールアドレスのドメイン（例：example.co.jp）
        is_active:
          type: boolean
          title: 有効
      required:
      - allowed_email_domains
      - client_id
    Session:
      type: object
      properties:
        is_authenticated:
          type: boolean
          readOnly: true
      required:
      - is_authenticated
    Todo:
      type: object
      description: 作業の計画の1項目（harness/tools/todo_write.py）
      properties:
        content:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TodoStatusEnum'
          readOnly: true
      required:
      - content
      - status
    TodoStatusEnum:
      enum:
      - pending
      - in_progress
      - completed
      type: string
      description: |-
        * `pending` - 未着手
        * `in_progress` - 作業中
        * `completed` - 完了
    ToolCallInfo:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        arguments:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - arguments
      - id
      - name
    ToolResultInfo:
      type: object
      properties:
        call_id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        is_error:
          type: boolean
          readOnly: true
        text:
          type: string
          readOnly: true
      required:
      - call_id
      - is_error
      - name
      - text
    UserStreamEvent:
      type: object
      description: ログインユーザー宛ての通知：自分のRunの状態の変更
      properties:
        type:
          type: string
          enum:
          - run.status
        run:
          type: string
        conversation:
          type: string
        status:
          $ref: '#/components/schemas/RunStatusEnum'
        sequence:
          type: integer
      required:
      - type
      - run
      - conversation
      - status
      - sequence
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
