components:
  schemas:
    AppModelProfile:
      type: object
      description: 社員が会話で選ぶためのモデル設定。接続先や単価は出さない
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
          title: 名前
        is_default:
          type: boolean
          readOnly: true
          title: 既定
        is_local:
          type: boolean
          readOnly: true
        supports_tools:
          type: boolean
          readOnly: true
        supports_images:
          type: boolean
          readOnly: true
        supports_documents:
          type: boolean
          readOnly: true
        supports_reasoning:
          type: boolean
          readOnly: true
        effort_values:
          type: array
          items:
            type: string
          readOnly: true
        default_effort:
          type: string
          readOnly: true
      required:
      - default_effort
      - effort_values
      - id
      - is_default
      - is_local
      - name
      - supports_documents
      - supports_images
      - supports_reasoning
      - supports_tools
    Artifact:
      type: object
      description: |-
        会話の添付と成果物。添付は `file` を送って作る（multipart/form-data）。メッセージに付けて送るまでは、
        一覧に出ない
      properties:
        id:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/ArtifactKindEnum'
          readOnly: true
        name:
          type: string
          readOnly: true
          title: ファイル名
        path:
          type: string
          readOnly: true
          title: パス
        content_type:
          type: string
          readOnly: true
          title: 形式
        size:
          type: integer
          readOnly: true
        run:
          type: string
          readOnly: true
          nullable: true
        created:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created
      - id
      - kind
      - name
      - path
      - run
      - size
    ArtifactKindEnum:
      enum:
      - 1
      - 2
      type: integer
      description: |-
        * `1` - 添付
        * `2` - 成果物
    ArtifactRequest:
      type: object
      description: |-
        会話の添付と成果物。添付は `file` を送って作る（multipart/form-data）。メッセージに付けて送るまでは、
        一覧に出ない
      properties:
        file:
          type: string
          format: binary
          writeOnly: true
          description: 添付するファイル
      required:
      - file
    AuthMethods:
      type: object
      description: ログイン画面に出すログインの方法
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/AuthProvider'
          readOnly: true
        password_login:
          type: boolean
          readOnly: true
          description: パスワードの欄を出すか。有効なSSOの設定があれば出さない（基盤管理者は /login?method=password
            で使う）
      required:
      - password_login
      - providers
    AuthProvider:
      type: object
      description: ログイン画面に並べる認証基盤。ログインは `login_url` へPOSTのフォームで送って始める
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        login_url:
          type: string
          readOnly: true
      required:
      - id
      - login_url
      - name
    ClarificationAnswerItem:
      type: object
      properties:
        selected:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 10
        text:
          type: string
          default: ''
          maxLength: 5000
    ClarificationAnswerItemRequest:
      type: object
      properties:
        selected:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 10
        text:
          type: string
          default: ''
          maxLength: 5000
    ClarificationAnswerRequest:
      type: object
      description: 確認への回答。質問ごとの選択（と自由記述）を質問と同じ順に送る。補足だけでもよい
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/ClarificationAnswerItemRequest'
        comment:
          type: string
          default: ''
          maxLength: 5000
    ClarificationEvent:
      type: object
      description: エージェントからの確認（回答待ち）
      properties:
        type:
          type: string
          readOnly: true
        run:
          type: string
          readOnly: true
        sequence:
          type: integer
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        clarification:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/ClarificationKindEnum'
          readOnly: true
      required:
      - clarification
      - created
      - kind
      - run
      - sequence
      - type
    ClarificationKindEnum:
      enum:
      - 1
      - 2
      type: integer
      description: |-
        * `1` - エージェントからの質問
        * `2` - モデルの切り替えの確認
    ClarificationOption:
      type: object
      properties:
        label:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
      required:
      - description
      - label
    ClarificationQuestion:
      type: object
      properties:
        header:
          type: string
          readOnly: true
        question:
          type: string
          readOnly: true
        options:
          type: array
          items:
            $ref: '#/components/schemas/ClarificationOption'
          readOnly: true
        multi_select:
          type: boolean
          readOnly: true
      required:
      - header
      - multi_select
      - options
      - question
    ClarificationRequest:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        run:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/ClarificationKindEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ClarificationStatusEnum'
          readOnly: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/ClarificationQuestion'
          readOnly: true
        answers:
          type: array
          items:
            $ref: '#/components/schemas/ClarificationAnswerItem'
          readOnly: true
        comment:
          type: string
          readOnly: true
          title: 補足
        answered_by:
          type: string
          readOnly: true
          nullable: true
        answered:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: 回答日時
        expires:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: 回答期限
        created:
          type: string
          format: date-time
          readOnly: true
      required:
      - answered
      - answered_by
      - answers
      - comment
      - created
      - expires
      - id
      - kind
      - questions
      - run
      - status
    ClarificationStatusEnum:
      enum:
      - 1
      - 2
      - 3
      - 4
      type: integer
      description: |-
        * `1` - 回答待ち
        * `2` - 回答済み
        * `3` - 期限切れ
        * `4` - 取消
    Conversation:
      type: object
      description: 自分の会話。モデル設定を省くと既定のモデル設定にする。実行中に変えると、次のステップから切り替わる
      properties:
        id:
          type: string
          readOnly: true
        model_profile:
          type: string
        model_profile_info:
          allOf:
          - $ref: '#/components/schemas/AppModelProfile'
          readOnly: true
        effort:
          type: string
          description: 空ならモデルの既定。値を入れると固定する
          maxLength: 50
        handles_sensitive_data:
          type: boolean
          title: 個人情報・機密情報を扱う
        title:
          type: string
          title: タイトル
          maxLength: 200
        last_posted:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: 最終投稿日時
        active_run:
          allOf:
          - $ref: '#/components/schemas/Run'
          nullable: true
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        updated:
          type: string
          format: date-time
          readOnly: true
      required:
      - active_run
      - created
      - id
      - last_posted
      - model_profile_info
      - updated
    ConversationRequest:
      type: object
      description: 自分の会話。モデル設定を省くと既定のモデル設定にする。実行中に変えると、次のステップから切り替わる
      properties:
        model_profile:
          type: string
          minLength: 1
        effort:
          type: string
          description: 空ならモデルの既定。値を入れると固定する
          maxLength: 50
        handles_sensitive_data:
          type: boolean
          title: 個人情報・機密情報を扱う
        title:
          type: string
          title: タイトル
          maxLength: 200
    Department:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          title: 名前
          maxLength: 100
        member_count:
          type: integer
          readOnly: true
          description: 所属する人数
        created:
          type: string
          format: date-time
          readOnly: true
        updated:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - id
      - member_count
      - name
      - updated
    DepartmentMembership:
      type: object
      description: 部門の所属。社員は作成時だけ指定し、後からは役割だけを変える
      properties:
        id:
          type: string
          readOnly: true
        user:
          type: string
        user_info:
          allOf:
