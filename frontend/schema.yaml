      - 12
      - 13
      - 14
      - 15
      - 16
      - 17
      - 18
      - 19
      - 20
      - 99
      type: integer
      description: |-
        * `1` - 完了
        * `2` - 停止
        * `10` - ステップ数の上限
        * `11` - 予算の上限
