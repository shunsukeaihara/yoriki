        password_login:
          type: boolean
          readOnly: true
          description: パスワードの欄を出すか。有効なSSOの設定があれば出さない（基盤管理者は /login?method=password
            で使う）
      required:
      - password_login
      - providers
    AuthProvider:
      type: object
      description: ログイン画面に並べる認証基盤。ログインは `login_url` へPOSTのフォームで送って始める
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        login_url:
          type: string
          readOnly: true
      required:
      - id
      - login_url
      - name
    BlankEnum:
      enum:
      - ''
    CellDiff:
      type: object
      properties:
        column:
          type: string
        before:
          type: string
          nullable: true
        after:
          type: string
          nullable: true
      required:
      - after
      - before
      - column
    ClarificationAnswerItem:
      type: object
      properties:
        selected:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 10
        text:
          type: string
          default: ''
          maxLength: 5000
    ClarificationAnswerItemRequest:
      type: object
      properties:
        selected:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 10
        text:
          type: string
          default: ''
          maxLength: 5000
    ClarificationAnswerRequest:
      type: object
      description: 確認への回答。質問ごとの選択（と自由記述）を質問と同じ順に送る。補足だけでもよい
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/ClarificationAnswerItemRequest'
        comment:
          type: string
          default: ''
          maxLength: 5000
    ClarificationContext:
