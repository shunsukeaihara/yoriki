        pids_limit:
          type: integer
          maximum: 4096
          minimum: 64
        tmp_mb:
          type: integer
          maximum: 8192
          minimum: 16
        work_mb:
          type: integer
          maximum: 32768
          minimum: 64
        output_mb:
          type: integer
          maximum: 32768
          minimum: 16
        env_mb:
          type: integer
          maximum: 32768
          minimum: 16
        command_timeout_seconds:
          type: integer
          maximum: 3600
