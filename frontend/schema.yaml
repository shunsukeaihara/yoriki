openapi: 3.0.3
info:
  title: Yoriki API
  version: 0.1.0
paths:
  /api/app/v1/auth/invitations/accept/:
    post:
      operationId: app_v1_auth_invitations_accept_create
      description: パスワードを設定してリンクを使用済みにし、ログインする
      tags:
      - app/auth/invitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/app/v1/auth/invitations/verify/:
    post:
      operationId: app_v1_auth_invitations_verify_create
      description: リンクを確かめ、宛先のメールアドレスと期限を返す
      tags:
      - app/auth/invitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationToken'
          description: ''
  /api/app/v1/auth/providers/:
    get:
      operationId: app_v1_auth_providers_retrieve
      description: ログインの方法
      tags:
      - app/auth/provider
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMethods'
          description: ''
  /api/app/v1/auth/session/:
    get:
      operationId: app_v1_auth_session_retrieve
      description: ログイン状態を返し、CSRFのCookieを設定する
      tags:
      - app/auth/session
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
    post:
      operationId: app_v1_auth_session_create
      description: メールアドレスとパスワードでログインする。有効なSSOの設定があれば基盤管理者だけ。失敗が続くと、アカウントごと・送信元のIPアドレスごとに一定時間止める（429）
      tags:
      - app/auth/session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
    delete:
      operationId: app_v1_auth_session_destroy
      description: ログアウトする
      tags:
      - app/auth/session
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/app/v1/connectors/:
    get:
      operationId: app_v1_connectors_list
      description: 会話で使えるConnector（入力欄の `@` の候補と、Skillで宣言するConnectorの候補）
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: scope
        schema:
          type: integer
        description: 4ならシステムのConnector（見る権限を持つ人だけ）。省けば会話で使えるもの
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - app/connector
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppConnectorList'
          description: ''
  /api/app/v1/connectors/{uid}/:
    get:
      operationId: app_v1_connectors_retrieve
      description: 会話で使えるConnector（入力欄の `@` の候補と、Skillで宣言するConnectorの候補）
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - app/connector
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConnectorDetail'
          description: ''
  /api/app/v1/conversations/:
    get:
      operationId: app_v1_conversations_list
      description: 自分の会話に関するAPI
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - app/conversation
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConversationList'
          description: ''
    post:
      operationId: app_v1_conversations_create
      description: 自分の会話に関するAPI
      tags:
      - app/conversation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
  /api/app/v1/conversations/{conversation}/artifacts/:
    get:
      operationId: app_v1_conversations_artifacts_list
      description: 会話の添付と成果物に関するAPI
      parameters:
      - in: path
        name: conversation
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: kind
        schema:
          type: integer
          title: 種別
          enum:
          - 1
          - 2
          - 3
        description: |-
          * `1` - 添付
          * `2` - 成果物
          * `3` - Connectorの結果
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - app/conversation/artifact
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtifactList'
          description: ''
    post:
      operationId: app_v1_conversations_artifacts_create
      description: 会話の添付と成果物に関するAPI
      parameters:
      - in: path
        name: conversation
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - app/conversation/artifact
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArtifactRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
          description: ''
  /api/app/v1/conversations/{conversation}/artifacts/{uid}/:
    get:
      operationId: app_v1_conversations_artifacts_retrieve
      description: 会話の添付と成果物に関するAPI
      parameters:
      - in: path
        name: conversation
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - app/conversation/artifact
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
          description: ''
  /api/app/v1/conversations/{conversation}/artifacts/{uid}/download/:
    get:
