          minLength: 1
          maxLength: 200
      required:
      - token
    LLMConnection:
      type: object
      description: プロバイダ接続の作成と表示。API keyは書き込み専用で、応答には末尾の4文字（api_key_hint）だけを出す
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          title: 名前
          maxLength: 100
        kind:
