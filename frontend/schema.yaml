        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        login_url:
          type: string
          readOnly: true
      required:
      - id
      - login_url
      - name
    Group:
      type: object
      description: 役割（Group）。ユーザーへの割り当てでは名前で指定する
      properties:
        name:
          type: string
          readOnly: true
          title: 名前
      required:
      - name
    InvitationAcceptRequest:
      type: object
