components:
  schemas:
    AppConnector:
      type: object
      description: |-
        利用者が会話で使えるConnector（入力欄の `@` の候補）。名前・説明・範囲・機密のフラグだけを返し、接続先や
        公開する表は返さない（authorization.md §7.2「候補のAPIと設定のAPIを分ける」）
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
          title: 名前
        kind_display:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        is_sensitive:
          type: boolean
          readOnly: true
          description: 機密。ローカルLLMのモデルの会話でだけ使える
        scope:
          allOf:
          - $ref: '#/components/schemas/ConnectorScopeEnum'
          readOnly: true
          title: 範囲
        scope_display:
          type: string
          readOnly: true
        department_info:
          allOf:
          - $ref: '#/components/schemas/MinimumDepartment'
          readOnly: true
          nullable: true
      required:
      - department_info
      - description
      - id
      - is_sensitive
      - kind_display
      - name
      - scope
      - scope_display
    AppConnectorDetail:
      type: object
      description: |-
        使えるConnectorの詳細。Skillで使う表を宣言するときの候補に、公開する表の名前と説明を返す（列の説明・接続先は
        返さない）
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
          title: 名前
        kind_display:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        is_sensitive:
          type: boolean
          readOnly: true
          description: 機密。ローカルLLMのモデルの会話でだけ使える
        scope:
          allOf:
          - $ref: '#/components/schemas/ConnectorScopeEnum'
          readOnly: true
          title: 範囲
        scope_display:
          type: string
          readOnly: true
        department_info:
          allOf:
          - $ref: '#/components/schemas/MinimumDepartment'
          readOnly: true
          nullable: true
        operations:
          type: array
          items:
            $ref: '#/components/schemas/OperationsEnum'
          readOnly: true
        tables:
          type: array
          items:
            $ref: '#/components/schemas/AppConnectorTable'
          readOnly: true
      required:
      - department_info
      - description
      - id
      - is_sensitive
      - kind_display
      - name
      - operations
      - scope
      - scope_display
      - tables
    AppConnectorTable:
      type: object
      properties:
        name:
          type: string
          description: 表の名前（スキーマがあれば `スキーマ.表`）
        description:
          type: string
      required:
      - description
      - name
    AppModelProfile:
      type: object
      description: 社員が会話で選ぶためのモデル設定。接続先や単価は出さない
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
          title: 名前
        is_default:
          type: boolean
          readOnly: true
          title: 既定
        is_local:
          type: boolean
          readOnly: true
        supports_tools:
          type: boolean
          readOnly: true
        supports_images:
          type: boolean
          readOnly: true
        supports_documents:
          type: boolean
          readOnly: true
        supports_reasoning:
          type: boolean
          readOnly: true
        effort_values:
          type: array
          items:
            type: string
          readOnly: true
        default_effort:
          type: string
          readOnly: true
      required:
      - default_effort
      - effort_values
      - id
      - is_default
      - is_local
      - name
      - supports_documents
      - supports_images
      - supports_reasoning
      - supports_tools
    Artifact:
      type: object
      description: |-
        会話の添付と成果物。添付は `file` を送って作る（multipart/form-data）。メッセージに付けて送るまでは、
        一覧に出ない
      properties:
        id:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/ArtifactKindEnum'
          readOnly: true
        name:
          type: string
          readOnly: true
          title: ファイル名
        path:
          type: string
          readOnly: true
          title: パス
        content_type:
          type: string
          readOnly: true
          title: 形式
        size:
          type: integer
          readOnly: true
        run:
          type: string
          readOnly: true
          nullable: true
        created:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created
      - id
      - kind
      - name
      - path
      - run
      - size
    ArtifactKindEnum:
      enum:
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `1` - 添付
        * `2` - 成果物
        * `3` - Connectorの結果
    ArtifactRequest:
      type: object
      description: |-
        会話の添付と成果物。添付は `file` を送って作る（multipart/form-data）。メッセージに付けて送るまでは、
        一覧に出ない
      properties:
        file:
          type: string
          format: binary
          writeOnly: true
          description: 添付するファイル
      required:
      - file
    AssetChecks:
      type: object
      description: 資料の検証の条件（design.md §3.9）。CSVだけが使う。公開の権限を持つ人だけが変えられる
      properties:
        encoding:
          description: "空なら自動で判別する\n\n* `` - \n* `utf-8` - utf-8\n* `utf-8-sig` -
            utf-8-sig\n* `cp932` - cp932"
          oneOf:
          - $ref: '#/components/schemas/CsvEncodingEnum'
          - $ref: '#/components/schemas/BlankEnum'
        delimiter:
          description: "空なら自動で判別する\n\n* `` - \n* `,` - ,\n* `\t` - \t\n* `;` - ;"
          oneOf:
          - $ref: '#/components/schemas/CsvDelimiterEnum'
          - $ref: '#/components/schemas/BlankEnum'
        required_columns:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 100
        key_columns:
          type: array
          items:
            type: string
            maxLength: 200
          description: 行を識別する列。重複・空を誤りにし、差分を行ごとに取る
          maxItems: 10
        column_types:
          type: array
          items:
            $ref: '#/components/schemas/ColumnType'
          description: 列ごとの値の型（文字列なら省く）
    AssetChecksRequest:
      type: object
      description: 資料の検証の条件（design.md §3.9）。CSVだけが使う。公開の権限を持つ人だけが変えられる
      properties:
        encoding:
          description: "空なら自動で判別する\n\n* `` - \n* `utf-8` - utf-8\n* `utf-8-sig` -
            utf-8-sig\n* `cp932` - cp932"
          oneOf:
          - $ref: '#/components/schemas/CsvEncodingEnum'
          - $ref: '#/components/schemas/BlankEnum'
        delimiter:
          description: "空なら自動で判別する\n\n* `` - \n* `,` - ,\n* `\t` - \t\n* `;` - ;"
          oneOf:
          - $ref: '#/components/schemas/CsvDelimiterEnum'
          - $ref: '#/components/schemas/BlankEnum'
        required_columns:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 100
        key_columns:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: 行を識別する列。重複・空を誤りにし、差分を行ごとに取る
          maxItems: 10
        column_types:
          type: array
          items:
            $ref: '#/components/schemas/ColumnTypeRequest'
          description: 列ごとの値の型（文字列なら省く）
    AssetDiff:
      type: object
      description: 前の版の同じ資料との差分。形式（MD・CSV・PPTX）によって持つ項目が違う
      properties:
        identical:
          type: boolean
        truncated:
          type: boolean
          description: 多すぎて一部だけを載せた
        lines_added:
          type: integer
        lines_removed:
          type: integer
        text:
          type: array
          items:
            type: string
          description: MDの本文の差分（unified diff）
        columns_added:
          type: array
          items:
            type: string
        columns_removed:
          type: array
          items:
            type: string
        rows_added:
          type: integer
        rows_removed:
          type: integer
        rows_changed:
          type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RowDiff'
        slides_added:
          type: integer
        slides_removed:
          type: integer
        slides_changed:
          type: integer
        reordered:
          type: boolean
        slides:
          type: array
          items:
            $ref: '#/components/schemas/SlideDiff'
    AssetDiffChangeEnum:
      enum:
      - added
      - removed
      - changed
      type: string
      description: |-
        * `added` - added
        * `removed` - removed
        * `changed` - changed
    AssetDiffCount:
      type: object
      description: 置き換えた資料の差分の数（形式によって持つ項目が違う）
      properties:
        key:
          type: string
          description: 資料のkey
        lines_added:
          type: integer
        lines_removed:
          type: integer
        rows_added:
          type: integer
        rows_removed:
          type: integer
        rows_changed:
          type: integer
        slides_added:
          type: integer
        slides_removed:
          type: integer
        slides_changed:
          type: integer
      required:
      - key
    AssetFormatEnum:
      enum:
      - md
      - csv
      - pptx
      - other
      type: string
      description: |-
        * `md` - md
        * `csv` - csv
        * `pptx` - pptx
        * `other` - other
    AssetValidation:
      type: object
      description: 資料の検証の結果（resources.formats.inspect()）。検証する前に公開した資料では空
      properties:
        format:
          $ref: '#/components/schemas/AssetFormatEnum'
        edited:
          type: boolean
          description: エージェントが元の資料を編集して作った候補か
        errors:
          type: array
          items:
            type: string
          description: 誤り。あれば公開できない
        warnings:
          type: array
          items:
            type: string
        info:
          type: object
          additionalProperties: {}
          description: 中身の概要（文字コード・列・行数・スライド数等）
        diff:
          allOf:
          - $ref: '#/components/schemas/AssetDiff'
          nullable: true
    AttemptOutcomeEnum:
      enum:
      - 1
      - 2
      - 3
      - 4
      type: integer
      description: |-
        * `1` - 受付確認
        * `2` - 一時的な失敗
        * `3` - 失敗
        * `4` - 届いたか分からない
    AuthMethods:
      type: object
      description: ログイン画面に出すログインの方法
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/AuthProvider'
