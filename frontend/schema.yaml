    post:
      operationId: v1_model_profiles_create
      description: モデル設定の管理API（基盤管理者だけ）
      tags:
      - manage/model_profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelProfileRequest'
          application/x-www-form-urlencoded:
