  /api/v1/model_profiles/{model_profile}/versions/:
    get:
      operationId: v1_model_profiles_versions_list
      description: モデル設定の版の履歴（基盤管理者だけ）
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: model_profile
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - manage/model_profile/version
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedModelProfileVersionList'
          description: ''
  /api/v1/model_profiles/{model_profile}/versions/{number}/:
    get:
      operationId: v1_model_profiles_versions_retrieve
      description: モデル設定の版の履歴（基盤管理者だけ）
      parameters:
      - in: path
        name: model_profile
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - in: path
        name: number
        schema:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: 版
        required: true
      tags:
      - manage/model_profile/version
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProfileVersion'
          description: ''
  /api/v1/model_profiles/{uid}/:
    get:
      operationId: v1_model_profiles_retrieve
      description: モデル設定の管理API（基盤管理者だけ）
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - manage/model_profile
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProfile'
          description: ''
    put:
      operationId: v1_model_profiles_update
      description: モデル設定の管理API（基盤管理者だけ）
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - manage/model_profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModelProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModelProfileRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProfile'
          description: ''
        '409':
          description: 他の変更と競合した（編集を始めた後に、別の版ができている）
    patch:
      operationId: v1_model_profiles_partial_update
      description: モデル設定の管理API（基盤管理者だけ）
      parameters:
      - in: path
        name: uid
        schema:
