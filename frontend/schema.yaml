    PatchedModelProfileRequest:
      type: object
      description: |-
        モデル設定。中身（接続、モデル名、上限、単価、能力）は現在の版の値を平らに出す。

        中身を変えて保存すると、サーバーが新しい版を作る。更新では、編集を始めた時点の `version` を送り、
        その間に他の人が版を作っていたら409になる
      properties:
        name:
          type: string
          minLength: 1
          title: 名前
          maxLength: 100
        is_active:
          type: boolean
          title: 有効
        version:
          type: integer
          minimum: 0
          description: 現在の版。更新では、編集を始めた時点の値を送る（作成では送らない）
        connection:
          type: string
          minLength: 1
        model_name:
          type: string
          minLength: 1
          maxLength: 200
        max_input_tokens:
          type: integer
          minimum: 1
        max_output_tokens:
          type: integer
          minimum: 1
        input_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          default: '0.000000'
        cached_input_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          default: '0.000000'
        output_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          default: '0.000000'
        supports_tools:
          type: boolean
          default: false
        supports_images:
          type: boolean
          default: false
        supports_documents:
          type: boolean
          default: false
        supports_audio:
          type: boolean
          default: false
        supports_video:
          type: boolean
          default: false
        supports_structured_output:
          type: boolean
          default: false
        supports_prompt_caching:
          type: boolean
          default: false
        supports_reasoning:
          type: boolean
          default: false
        effort_values:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          description: モデルが受け付けるeffortの値（各社の指定そのまま）。推論の制御に対応するモデルだけ
          maxItems: 20
        default_effort:
          type: string
          default: ''
          maxLength: 50
        change_reason:
          type: string
          writeOnly: true
          maxLength: 500
    PatchedRuntimeProfileRequest:
      type: object
      description: |-
        Runtime Profile。中身（イメージ、資源の上限）は現在の版の値を平らに出す。

        イメージは「名前@sha256:digest」で受け取り、レジストリのAPIで契約番号と対応platformを確かめてから版に入れる
        （design.md §7.3）。中身を変えて保存すると新しい版を作る。更新では、編集を始めた時点の `version` を送る
      properties:
        name:
          type: string
          minLength: 1
          title: 名前
          maxLength: 100
        is_active:
          type: boolean
          title: 有効
        version:
          type: integer
          minimum: 0
          description: 現在の版。更新では、編集を始めた時点の値を送る（作成では送らない）
        image:
          type: string
          minLength: 1
          description: 「名前@sha256:digest」（例：yoriki/yoriki-sandbox-docs@sha256:…）。タグだけの指定はできない
          maxLength: 500
        memory_mb:
          type: integer
          maximum: 65536
          minimum: 512
        cpus:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        pids_limit:
          type: integer
          maximum: 4096
          minimum: 64
        tmp_mb:
          type: integer
          maximum: 8192
          minimum: 16
        work_mb:
          type: integer
          maximum: 32768
          minimum: 64
        output_mb:
          type: integer
          maximum: 32768
          minimum: 16
        env_mb:
          type: integer
          maximum: 32768
          minimum: 16
        command_timeout_seconds:
          type: integer
          maximum: 3600
          minimum: 10
        job_timeout_seconds:
          type: integer
          maximum: 86400
          minimum: 60
        change_reason:
          type: string
          writeOnly: true
          maxLength: 500
    PatchedSSOProviderUpdateRequest:
      type: object
      description: SSOの設定の更新。種別は変えられないので、読み取り専用にする
      properties:
        client_id:
          type: string
          minLength: 1
          maxLength: 500
