    RuntimeProfile:
      type: object
      description: |-
        Runtime Profile。中身（イメージ、資源の上限）は現在の版の値を平らに出す。

        イメージは「名前@sha256:digest」で受け取り、レジストリのAPIで契約番号と対応platformを確かめてから版に入れる
        （design.md §7.3）。中身を変えて保存すると新しい版を作る。更新では、編集を始めた時点の `version` を送る
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          title: 名前
          maxLength: 100
        is_active:
          type: boolean
          title: 有効
        is_default:
          type: boolean
          readOnly: true
          title: 既定
        version:
          type: integer
          minimum: 0
          description: 現在の版。更新では、編集を始めた時点の値を送る（作成では送らない）
        image:
          type: string
          description: 「名前@sha256:digest」（例：yoriki/yoriki-sandbox-docs@sha256:…）。タグだけの指定はできない
          maxLength: 500
        contract:
          type: integer
          readOnly: true
        platforms:
          type: array
          items:
            type: string
          readOnly: true
        python_version:
          type: string
          readOnly: true
        memory_mb:
          type: integer
          maximum: 65536
          minimum: 512
        cpus:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        pids_limit:
          type: integer
          maximum: 4096
          minimum: 64
        tmp_mb:
          type: integer
          maximum: 8192
          minimum: 16
        work_mb:
          type: integer
          maximum: 32768
          minimum: 64
        output_mb:
          type: integer
          maximum: 32768
          minimum: 16
        env_mb:
          type: integer
          maximum: 32768
          minimum: 16
        command_timeout_seconds:
          type: integer
          maximum: 3600
          minimum: 10
        job_timeout_seconds:
          type: integer
          maximum: 86400
          minimum: 60
        created_by:
          type: string
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        updated:
          type: string
          format: date-time
          readOnly: true
      required:
      - contract
      - created
      - created_by
      - id
      - image
      - is_default
      - name
      - platforms
      - python_version
      - updated
