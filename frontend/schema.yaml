    ModelProfile:
      type: object
      description: |-
        モデル設定。中身（接続、モデル名、上限、単価、能力）は現在の版の値を平らに出す。

        中身を変えて保存すると、サーバーが新しい版を作る。更新では、編集を始めた時点の `version` を送り、
        その間に他の人が版を作っていたら409になる
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          title: 名前
          maxLength: 100
        is_active:
          type: boolean
          title: 有効
        is_default:
          type: boolean
          readOnly: true
          title: 既定
        version:
          type: integer
          minimum: 0
          description: 現在の版。更新では、編集を始めた時点の値を送る（作成では送らない）
        connection:
          type: string
        model_name:
          type: string
          maxLength: 200
        max_input_tokens:
          type: integer
          minimum: 1
        max_output_tokens:
          type: integer
          minimum: 1
        input_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          default: '0.000000'
        cached_input_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          default: '0.000000'
        output_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          default: '0.000000'
        supports_tools:
          type: boolean
          default: false
        supports_images:
          type: boolean
          default: false
        supports_documents:
          type: boolean
          default: false
        supports_audio:
          type: boolean
          default: false
        supports_video:
          type: boolean
          default: false
        supports_structured_output:
          type: boolean
          default: false
        supports_prompt_caching:
          type: boolean
          default: false
        supports_reasoning:
