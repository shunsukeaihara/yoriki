  /api/app/v1/conversations/{uid}/:
    get:
      operationId: app_v1_conversations_retrieve
      description: 自分の会話に関するAPI
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - app/conversation
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
    patch:
      operationId: app_v1_conversations_partial_update
      description: 自分の会話に関するAPI
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - app/conversation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedConversationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedConversationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedConversationRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
    delete:
      operationId: app_v1_conversations_destroy
      description: 自分の会話に関するAPI
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - app/conversation
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/app/v1/destinations/:
    get:
      operationId: app_v1_destinations_list
      description: タスクの編集画面で選ぶ出口の候補（停止中でなく、タスクを管理できる範囲のもの。authorization.md §7.2）
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: department
        schema:
          type: string
        description: 部門のID（部門の範囲のとき）
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: scope
        schema:
          type: integer
        description: タスクの範囲（1：個人、2：部門、3：全社、4：システム）
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - app/destination
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDestinationChoiceList'
          description: ''
