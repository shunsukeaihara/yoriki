        '401':
          description: No response body
        '404':
          description: No response body
  /api/hooks/v1/tasks/{task}/:
    post:
      operationId: hooks_v1_tasks_create
      description: Webhookでタスクを起動する（design.md §4.2）。受け付けたら202とrun_idを返し、作業の完了を待たない。同じイベントID（入口で指定した場所・Idempotency-Key
        ヘッダー・推奨の形式の event_id）の再送には、前のRunを200で返す。ファイルは multipart/form-data で付ける（URLの取得はしない）
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
      - in: path
        name: task
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - hooks/task
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
          text/plain:
            schema:
              type: string
      security:
      - hookKey: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookReceived'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookReceived'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookError'
          description: payloadの形・項目の誤り（Runは作らない）
        '401':
          description: 鍵がないか、正しくない
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookError'
          description: 入口が停止中
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookError'
          description: 同じイベントIDで違う内容を受け取った、またはタスクを今は実行できない
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookError'
          description: payloadが入口の上限より大きい
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookError'
          description: 受け付けない形式
