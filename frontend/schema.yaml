  /api/app/v1/runs/:
    get:
      operationId: app_v1_runs_list
      description: 自分のRunに関するAPI
      parameters:
      - in: query
        name: conversation
        schema:
          type: string
        description: 会話
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: integer
          title: 状態
          enum:
          - 1
          - 10
          - 2
          - 20
          - 3
          - 30
          - 4
          - 5
        description: |-
          * `1` - 順番待ち
          * `2` - 作業中
          * `3` - 確認待ち
          * `4` - 再試行待ち
          * `5` - 停止中
          * `10` - 完了
          * `20` - 失敗
          * `30` - 停止済み
      tags:
      - app/run
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRunList'
          description: ''
