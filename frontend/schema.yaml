            event_id。どれもなければ重複を判定せず、送り元が再送すると二重に実行する
          maxLength: 200
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/TriggerInput'
          description: 項目の取り出し。空なら推奨の形式の inputs をそのまま使う。型と必須かはタスクの入力の項目で決まる
        max_payload_bytes:
          type: integer
          maximum: 10485760
          minimum: 1024
          default: 1048576
          description: payloadの大きさの上限（バイト。既定1MiB、最大10MiB）
        url:
          type: string
          readOnly: true
          description: 送り元に設定するURL（/api/ からのパス）
        key_prefix:
          type: string
          readOnly: true
