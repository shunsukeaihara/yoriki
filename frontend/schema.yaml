openapi: 3.0.3
info:
  title: Yoriki API
  version: 0.1.0
paths:
  /api/app/v1/auth/invitations/accept/:
    post:
      operationId: app_v1_auth_invitations_accept_create
      description: パスワードを設定してリンクを使用済みにし、ログインする
      tags:
      - app/auth/invitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/app/v1/auth/invitations/verify/:
    post:
      operationId: app_v1_auth_invitations_verify_create
      description: リンクを確かめ、宛先のメールアドレスと期限を返す
      tags:
      - app/auth/invitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationToken'
          description: ''
  /api/app/v1/auth/providers/:
    get:
      operationId: app_v1_auth_providers_retrieve
      description: ログインの方法
      tags:
      - app/auth/provider
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMethods'
          description: ''
  /api/app/v1/auth/session/:
    get:
      operationId: app_v1_auth_session_retrieve
      description: ログイン状態を返し、CSRFのCookieを設定する
      tags:
      - app/auth/session
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
    post:
      operationId: app_v1_auth_session_create
      description: メールアドレスとパスワードでログインする。有効なSSOの設定があれば基盤管理者だけ。失敗が続くと、アカウントごと・送信元のIPアドレスごとに一定時間止める（429）
      tags:
      - app/auth/session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
    delete:
      operationId: app_v1_auth_session_destroy
      description: ログアウトする
      tags:
      - app/auth/session
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/app/v1/conversations/:
    get:
      operationId: app_v1_conversations_list
      description: 自分の会話に関するAPI
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - app/conversation
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConversationList'
          description: ''
    post:
      operationId: app_v1_conversations_create
      description: 自分の会話に関するAPI
      tags:
      - app/conversation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
  /api/app/v1/conversations/{conversation}/artifacts/:
    get:
      operationId: app_v1_conversations_artifacts_list
      description: 会話の添付と成果物に関するAPI
      parameters:
      - in: path
        name: conversation
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: kind
        schema:
          type: integer
          title: 種別
          enum:
          - 1
          - 2
        description: |-
          * `1` - 添付
          * `2` - 成果物
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - app/conversation/artifact
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtifactList'
          description: ''
    post:
      operationId: app_v1_conversations_artifacts_create
      description: 会話の添付と成果物に関するAPI
      parameters:
      - in: path
        name: conversation
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - app/conversation/artifact
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArtifactRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
          description: ''
  /api/app/v1/conversations/{conversation}/artifacts/{uid}/:
    get:
      operationId: app_v1_conversations_artifacts_retrieve
      description: 会話の添付と成果物に関するAPI
      parameters:
      - in: path
        name: conversation
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - app/conversation/artifact
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
          description: ''
  /api/app/v1/conversations/{conversation}/artifacts/{uid}/download/:
    get:
      operationId: app_v1_conversations_artifacts_download_retrieve
      description: ファイルを取得する（ダウンロードとして返す）
      parameters:
      - in: path
        name: conversation
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - app/conversation/artifact
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ファイル
  /api/app/v1/conversations/{conversation}/messages/:
    get:
      operationId: app_v1_conversations_messages_list
      description: 会話のメッセージに関するAPI
      parameters:
      - in: path
        name: conversation
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - app/conversation/message
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessageList'
          description: ''
    post:
      operationId: app_v1_conversations_messages_create
      description: 会話のメッセージに関するAPI
      parameters:
      - in: path
        name: conversation
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - app/conversation/message
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/app/v1/conversations/{uid}/:
    get:
      operationId: app_v1_conversations_retrieve
      description: 自分の会話に関するAPI
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - app/conversation
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
    patch:
      operationId: app_v1_conversations_partial_update
      description: 自分の会話に関するAPI
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - app/conversation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedConversationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedConversationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedConversationRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
    delete:
      operationId: app_v1_conversations_destroy
      description: 自分の会話に関するAPI
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - app/conversation
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/app/v1/model_profiles/:
    get:
      operationId: app_v1_model_profiles_list
      description: 会話で選べるモデル設定
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - app/model_profile
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppModelProfile'
          description: ''
  /api/app/v1/model_profiles/{uid}/:
    get:
      operationId: app_v1_model_profiles_retrieve
      description: 会話で選べるモデル設定
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - app/model_profile
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppModelProfile'
          description: ''
  /api/app/v1/my/:
    get:
      operationId: app_v1_my_retrieve
      description: ログイン中の利用者と権限を返す
      tags:
      - app/my
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyUser'
          description: ''
  /api/app/v1/runs/:
    get:
      operationId: app_v1_runs_list
      description: 自分のRunに関するAPI
      parameters:
      - in: query
        name: conversation
        schema:
          type: string
        description: 会話
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: integer
          title: 状態
          enum:
          - 1
          - 10
          - 2
          - 20
          - 3
          - 30
          - 4
          - 5
        description: |-
          * `1` - 順番待ち
          * `2` - 作業中
          * `3` - 確認待ち
          * `4` - 再試行待ち
          * `5` - 停止中
          * `10` - 完了
          * `20` - 失敗
          * `30` - 停止済み
      tags:
      - app/run
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRunList'
          description: ''
  /api/app/v1/runs/{run}/clarifications/:
    get:
      operationId: app_v1_runs_clarifications_list
      description: エージェントからの確認
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: run
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: integer
          title: 状態
          enum:
          - 1
          - 2
          - 3
          - 4
        description: |-
          * `1` - 回答待ち
          * `2` - 回答済み
          * `3` - 期限切れ
          * `4` - 取消
      tags:
      - app/run/clarification
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClarificationRequestList'
          description: ''
  /api/app/v1/runs/{run}/clarifications/{uid}/:
    get:
      operationId: app_v1_runs_clarifications_retrieve
      description: エージェントからの確認
      parameters:
      - in: path
        name: run
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - app/run/clarification
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationRequest'
          description: ''
  /api/app/v1/runs/{run}/clarifications/{uid}/answer/:
    post:
      operationId: app_v1_runs_clarifications_answer_create
      description: 確認に回答する。回答を受け付けるとRunが再開される
      parameters:
      - in: path
        name: run
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - app/run/clarification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarificationAnswerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClarificationAnswerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClarificationAnswerRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationRequest'
          description: ''
        '409':
          description: すでに回答済み
  /api/app/v1/runs/{run}/events/:
    get:
      operationId: app_v1_runs_events_list
      description: Runのイベントの履歴
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: run
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - app/run/event
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRunStreamEventList'
          description: ''
  /api/app/v1/runs/{uid}/:
    get:
      operationId: app_v1_runs_retrieve
      description: 自分のRunに関するAPI
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - app/run
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
  /api/app/v1/runs/{uid}/cancel/:
    post:
      operationId: app_v1_runs_cancel_create
      description: 実行の停止を依頼する。実行中の場合は停止中になり、Workerが停止を確かめると停止済みになる
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - app/run
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCancelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RunCancelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RunCancelRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
        '409':
          description: 他の処理と競合した
  /api/app/v1/skills/:
    get:
      operationId: app_v1_skills_list
      description: Skillの一覧・作成・公開・切戻し・停止
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: department
        schema:
          type: string
        description: 部門
      - in: query
        name: name
        schema:
          type: string
        description: 名前
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: published
        schema:
          type: boolean
        description: 公開済み
      - in: query
        name: scope
        schema:
          type: integer
          title: 公開範囲
          enum:
          - 1
          - 2
          - 3
        description: |-
          公開範囲

          * `1` - 個人
          * `2` - 部門
          * `3` - 全社
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: suspended
        schema:
          type: boolean
      tags:
      - app/skill
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSkillList'
          description: ''
    post:
      operationId: app_v1_skills_create
      description: Skillの一覧・作成・公開・切戻し・停止
      tags:
      - app/skill
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SkillCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SkillCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
          description: ''
  /api/app/v1/skills/{skill}/changes/:
    get:
      operationId: app_v1_skills_changes_list
      description: Skillの公開・切戻し・停止の記録
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: path
        name: skill
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - app/skill/change
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
