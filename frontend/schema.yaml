          maxItems: 50
        requires:
          type: array
          items:
            $ref: '#/components/schemas/SkillRequirementEnum'
          maxItems: 10
        input_schema:
          nullable: true
        output_schema:
          nullable: true
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorDeclarationRequest'
          description: 使うConnectorと操作・表の宣言。宣言したConnectorを使えない人には、このSkillを出さない
        is_sensitive:
          type: boolean
          description: 機密。付けるのは編集の権限、外すのは公開の権限（authorization.md §5.1）
    PatchedSkillEvaluationCaseRequest:
      type: object
      description: |-
        評価ケース。添付はファイルを送る（multipart/form-data）。`expected_result` はJSONの文字列でもよい。

        必須の印の付け外しと、必須のケースの変更・削除は公開の権限が要る（編集の権限で公開の条件を緩めないため）
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        prompt:
          type: string
          minLength: 1
          description: 依頼の文。評価のRunの最初の発言になる
          maxLength: 100000
        criteria:
          type: string
          description: LLMの判定に使う、確認する観点
          maxLength: 10000
        expected_result:
          nullable: true
          description: 期待する業務結果。書いた項目だけを submit_result の値と照合する
        required:
          type: boolean
          title: 公開の前に必須
        add_files:
          type: array
          items:
            type: string
            format: binary
          writeOnly: true
          description: 加える添付
        remove_files:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 30
          writeOnly: true
          description: 外す添付のID
    PatchedSkillRequest:
      type: object
      description: Skillと公開中の版の概要。中身は版（versions）とDraft（drafts）で扱う
      properties:
        name:
          type: string
          minLength: 1
          title: 名前
          maxLength: 100
    PatchedTaskDefinitionUpdateRequest:
      type: object
      description: タスクの更新。範囲と部門は変えられないので、読み取り専用にする
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        version:
          type: integer
          minimum: 0
          description: 今の版。更新では、編集を始めた時点の値を送る（作成では送らない）
        description:
          type: string
          maxLength: 2000
        prompt_template:
          type: string
          minLength: 1
          maxLength: 20000
        skills:
          type: array
          items:
            $ref: '#/components/schemas/TaskSkillRequest'
        connectors:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 30
          description: 使うConnectorのID。タスクのRunでは、エージェントはここにあるものだけを使う
          maxItems: 10
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolsEnum'
