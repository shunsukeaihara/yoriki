          type: string
          writeOnly: true
          minLength: 1
          maxLength: 200
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
      required:
      - password
      - token
    InvitationLink:
      type: object
      description: 発行したリンク。URLはこの応答でしか分からない（tokenはDBにハッシュだけを保存する）
      properties:
        url:
          type: string
          readOnly: true
          description: 本人に渡すURL。tokenはURLのフラグメントに入れる
        purpose:
          type: integer
          readOnly: true
        purpose_display:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - expires_at
      - purpose
      - purpose_display
      - url
    InvitationToken:
      type: object
      description: リンクの確認。宛先のメールアドレスと期限を返す
      properties:
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          readOnly: true
        purpose:
          type: integer
          readOnly: true
        purpose_display:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - display_name
      - email
      - expires_at
      - purpose
      - purpose_display
    InvitationTokenRequest:
      type: object
