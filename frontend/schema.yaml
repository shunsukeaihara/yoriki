      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessageList'
          description: ''
    post:
      operationId: app_v1_conversations_messages_create
      description: 会話のメッセージに関するAPI
      parameters:
      - in: path
        name: conversation
        schema:
          type: string
          pattern: ^[^/]+$
