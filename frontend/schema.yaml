            type: string
            maxLength: 50
          description: モデルが受け付けるeffortの値（各社の指定そのまま）。推論の制御に対応するモデルだけ
          maxItems: 20
        default_effort:
          type: string
          default: ''
          maxLength: 50
        connection_info:
