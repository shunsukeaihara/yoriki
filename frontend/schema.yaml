    PatchedLLMConnectionUpdateRequest:
      type: object
      description: プロバイダ接続の更新。種別とbase URL（接続先）は変えられないので、読み取り専用にする
      properties:
        name:
          type: string
          minLength: 1
          title: 名前
          maxLength: 100
        api_key:
          type: string
          writeOnly: true
          description: 更新では、送らなければ変更しない。空文字はAPI keyなし（ローカルLLMだけ）
          maxLength: 1000
        timeout_seconds:
          type: integer
          maximum: 3600
          minimum: 1
          title: タイムアウト（秒）
        max_concurrency:
          type: integer
          maximum: 1000
          minimum: 1
          title: 同時実行数の上限
        requests_per_minute:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
          title: 1分あたりの要求数の上限
        is_active:
          type: boolean
          title: 有効
    PatchedManageUserUpdateRequest:
      type: object
      description: ユーザーの更新。メールアドレスはSSOの紐付けに使うので変えない
      properties:
        display_name:
          type: string
          title: 表示名
          maxLength: 150
        groups:
          type: array
          items:
            type: string
            minLength: 1
            title: 名前
          description: 役割の名前
        is_active:
          type: boolean
          title: 有効
          description: ユーザーがアクティブかどうかを示します。アカウントを削除する代わりに選択を解除してください。
    PatchedModelProfileRequest:
      type: object
      description: |-
        モデル設定。中身（接続、モデル名、上限、単価、能力）は現在の版の値を平らに出す。

        中身を変えて保存すると、サーバーが新しい版を作る。更新では、編集を始めた時点の `version` を送り、
        その間に他の人が版を作っていたら409になる
      properties:
        name:
          type: string
          minLength: 1
          title: 名前
          maxLength: 100
        is_active:
          type: boolean
          title: 有効
        version:
          type: integer
          minimum: 0
          description: 現在の版。更新では、編集を始めた時点の値を送る（作成では送らない）
        connection:
          type: string
          minLength: 1
        model_name:
          type: string
          minLength: 1
          maxLength: 200
        max_input_tokens:
          type: integer
          minimum: 1
        max_output_tokens:
          type: integer
          minimum: 1
        input_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          default: '0.000000'
        cached_input_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          default: '0.000000'
        output_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          default: '0.000000'
        supports_tools:
          type: boolean
          default: false
        supports_images:
          type: boolean
          default: false
        supports_structured_output:
          type: boolean
          default: false
        supports_prompt_caching:
          type: boolean
          default: false
        supports_reasoning:
          type: boolean
          default: false
        change_reason:
          type: string
          writeOnly: true
          maxLength: 500
    PatchedSSOProviderUpdateRequest:
      type: object
      description: SSOの設定の更新。種別は変えられないので、読み取り専用にする
      properties:
        client_id:
          type: string
          minLength: 1
          maxLength: 500
