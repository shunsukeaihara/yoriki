    Connector:
      type: object
      description: |-
        Connectorの作成と表示。境界（公開する表、上限、機密のフラグ）は現在の版の値を平らに出す。

        境界を変えて保存すると、サーバーが新しい版を作る。更新では、編集を始めた時点の `version` を送り、
        その間に他の人が版を作っていたら409になる。使うDB接続は作成した後は変えられない。

        範囲（部門・全社・システム）と部門は作成時に決め、更新では変えない（authorization.md §5.2）。作成・編集は
        所属を問わず、permissionだけで判定する
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          title: 名前
          maxLength: 100
        connection:
          type: string
          description: 使う接続先
        connection_info:
          allOf:
          - $ref: '#/components/schemas/MinimumDatabaseConnection'
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/ConnectorKindEnum'
          readOnly: true
        kind_display:
          type: string
          readOnly: true
        is_active:
          type: boolean
          title: 有効
        version:
          type: integer
          minimum: 0
          description: 現在の版。更新では、編集を始めた時点の値を送る（作成では送らない）
        description:
          type: string
          default: ''
          description: エージェントに見せる、このConnectorの説明
          maxLength: 5000
        default_schema:
          type: string
          description: 表の名前にスキーマを書かなかったときのスキーマ。省略すると種別の既定（public、dbo）
          maxLength: 128
        tables:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorTableEntry'
        max_rows:
          type: integer
          maximum: 1000000
          minimum: 1
          default: 1000
        max_result_bytes:
          type: integer
          maximum: 1073741824
          minimum: 1024
          default: 10485760
        timeout_seconds:
          type: integer
          maximum: 3600
          minimum: 1
          default: 30
        is_sensitive:
          type: boolean
          default: false
          description: 個人情報を主な中身とする範囲。ローカルLLMのモデルを使うタスク・会話にだけ割り当てる
        scope:
          allOf:
          - $ref: '#/components/schemas/ConnectorScopeEnum'
          description: |-
            範囲。作成した後は変えられない

            * `2` - 部門
            * `3` - 全社
            * `4` - システム
        scope_display:
          type: string
          readOnly: true
        department:
          type: string
          nullable: true
          description: 部門の範囲では必須。作成した後は変えられない
        department_info:
          allOf:
          - $ref: '#/components/schemas/MinimumDepartment'
          readOnly: true
          nullable: true
        created_by:
          type: string
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        updated:
          type: string
          format: date-time
          readOnly: true
      required:
      - connection
      - connection_info
      - created
      - created_by
      - department_info
      - id
      - kind
      - kind_display
      - name
      - scope
      - scope_display
      - updated
