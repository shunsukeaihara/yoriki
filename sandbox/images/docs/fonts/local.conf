<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Sandboxのフォントの置換え（design.md §7.6）。入っているのはNoto CJKだけなので、総称はNoto CJKの日本語の字形へ向け、
     Windows・macOSのよくあるフォントはSans・Serif・Monoへ寄せる。元のフォントと文字の幅が違うので、改行やレイアウトはずれうる -->
<fontconfig>
  <alias binding="same"><family>sans-serif</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>Noto Sans Mono CJK JP</family></prefer></alias>
  <alias binding="same"><family>sans</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>mono</family><prefer><family>Noto Sans Mono CJK JP</family></prefer></alias>
  <alias binding="same"><family>Meiryo</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>メイリオ</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Meiryo UI</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Yu Gothic</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>游ゴシック</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Yu Gothic UI</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>YuGothic</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>MS Gothic</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>ＭＳ ゴシック</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>MS PGothic</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>ＭＳ Ｐゴシック</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>MS UI Gothic</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Hiragino Sans</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Hiragino Kaku Gothic ProN</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>ヒラギノ角ゴ ProN</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>BIZ UDGothic</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>BIZ UDPGothic</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Arial</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Helvetica</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Calibri</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Segoe UI</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Verdana</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Tahoma</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Aptos</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Liberation Sans</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>DejaVu Sans</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>MS Mincho</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>ＭＳ 明朝</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>MS PMincho</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>ＭＳ Ｐ明朝</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>Yu Mincho</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>游明朝</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>YuMincho</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>Hiragino Mincho ProN</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>ヒラギノ明朝 ProN</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>BIZ UDMincho</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>BIZ UDPMincho</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>Times New Roman</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>Times</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>Century</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>Cambria</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>Georgia</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>Liberation Serif</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>DejaVu Serif</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>Courier New</family><accept><family>Noto Sans Mono CJK JP</family></accept></alias>
  <alias binding="same"><family>Courier</family><accept><family>Noto Sans Mono CJK JP</family></accept></alias>
  <alias binding="same"><family>Consolas</family><accept><family>Noto Sans Mono CJK JP</family></accept></alias>
  <alias binding="same"><family>Liberation Mono</family><accept><family>Noto Sans Mono CJK JP</family></accept></alias>
  <alias binding="same"><family>DejaVu Sans Mono</family><accept><family>Noto Sans Mono CJK JP</family></accept></alias>
  <!-- 文書の言語が中国語・韓国語なら、そちらの字形を優先する -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans Mono CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans Mono CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans Mono CJK KR</string></edit>
  </match>
</fontconfig>
